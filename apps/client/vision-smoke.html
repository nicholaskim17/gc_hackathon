<!doctype html><html lang="en"><meta charset="utf-8"><title>Rally vision diagnostic</title><style>body{font:18px system-ui;max-width:800px;margin:60px auto;padding:24px;background:#eef5fa;color:#243d50}button{padding:15px 25px;border:0;border-radius:20px;background:#159ed4;color:white;font:inherit}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:20px}</style><h1>Rally vision diagnostic</h1><p>Loads the real local model in the game worker and runs a generated blank frame. No camera access.</p><button id="start">Test local vision model</button><pre id="status" aria-live="polite">Ready to test.</pre><script type="module">
const button=document.querySelector('#start'),status=document.querySelector('#status');let worker;button.onclick=()=>{button.disabled=true;status.textContent='Loading worker and local model…';worker=new Worker(new URL('./src/tracking.worker.ts',import.meta.url),{type:'module'});const timeout=setTimeout(()=>{status.textContent+='\nFAIL: model or inference timed out after 30 seconds.';worker.terminate();button.disabled=false;},30000);worker.onerror=e=>{status.textContent+='\nFAIL: '+e.message;clearTimeout(timeout);button.disabled=false;};worker.onmessage=async e=>{if(e.data.type==='diagnostic')status.textContent+='\n'+e.data.message;if(e.data.type==='ready'){status.textContent+='\nModel ready ('+(e.data.delegate??'automatic delegate')+'). Running generated blank frame…';const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const context=canvas.getContext('2d');context.fillStyle='#808080';context.fillRect(0,0,640,360);const bitmap=await createImageBitmap(canvas);worker.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);}if(e.data.type==='pose'){status.textContent+='\nPASS: real worker inference returned '+e.data.landmarks.length+' pose landmarks on a blank frame (expected 0).';clearTimeout(timeout);worker.terminate();button.disabled=false;}if(e.data.type==='error'){status.textContent+='\nFAIL: '+e.data.message;clearTimeout(timeout);worker.terminate();button.disabled=false;}};worker.postMessage({type:'init',base:new URL('./',location.href).href});};
</script></html>
